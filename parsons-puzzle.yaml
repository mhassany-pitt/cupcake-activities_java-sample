  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
  - basic-syntax
  - classes
  topics:
  - classes
  - constructors
  - methods
  - conditional-logic
  - variable-scope
runtime:
  language: java
  version: 17
statement: |
  Rearrange the blocks to correctly implement the constructor and methods for the `BankAccount` class in Java.
  Make sure to:
  1. Initialize the instance fields (`owner` and `balance`) using `this`.
  2. Implement the `deposit` method with positive input validation.
  3. Implement the `withdraw` method with strict overdraft protection and insufficient funds notification.
executions:
- title: Standard Transaction
  stdout: |-
    Deposited 100
    Withdrew 50
    Balance: 250
  console: |-
    Deposited 100
    Withdrew 50
    Balance: 250
  status: pass
elements:
- type: block
  group: bank-members
  location:
    snippet: |2-

          public BankAccount(String owner, int balance) {
              this.owner = owner;
              this.balance = balance;
          }
  choices:
  - snippet: |2-

          public BankAccount(String owner, int balance) {
              this.owner = owner;
              this.balance = balance;
          }
    role: solution
    explanations:
    - body: 'Correct! Uses `this.owner = owner;` and `this.balance = balance;` to
        assign constructor parameter values to instance fields.

'
  - snippet: |-
      public BankAccount(String owner, int balance) {
          owner = owner;
          balance = balance;
      }
    role: distractor
    explanations:
    - body: 'Incorrect. Without `this.`, `owner = owner` assigns parameters back to
        themselves (shadowing) without updating the actual instance fields `this.owner`
        and `this.balance`.

'
- type: block
  group: bank-members
  location:
    snippet: |2-

          public int deposit(int amount) {
              if (amount > 0) {
                  this.balance = this.balance + amount;
                  System.out.println("Deposited " + amount);
              }
              return this.balance;
          }
  choices:
  - snippet: |2-

          public int deposit(int amount) {
              if (amount > 0) {
                  this.balance = this.balance + amount;
                  System.out.println("Deposited " + amount);
              }
              return this.balance;
          }
    role: solution
    explanations:
    - body: 'Correct! Validates that `amount > 0` before updating `this.balance`,
        prints confirmation, and returns the updated balance.

'
  - snippet: |-
      public int deposit(int amount) {
          this.balance = this.balance + amount;
          System.out.println("Deposited " + amount);
          return this.balance;
      }
    role: distractor
    explanations:
    - body: 'Incorrect. Omits the `if (amount > 0)` input validation guard, allowing
        zero or negative deposit amounts to erroneously corrupt account balances.

'
  - snippet: |-
      public int deposit(int amount) {
          if (amount > 0) {
              this.balance = this.balance - amount;
              System.out.println("Deposited " + amount);
          }
          return this.balance;
      }
    role: distractor
    explanations:
    - body: 'Incorrect. Uses subtraction (`-`) instead of addition (`+`), deducting
        money from the account balance during a deposit transaction.

'
- type: block
  group: bank-members
  location:
    snippet: |2-

          public int withdraw(int amount) {
              if (0 < amount && amount <= this.balance) {
                  this.balance = this.balance - amount;
                  System.out.println("Withdrew " + amount);
              } else {
                  System.out.println("Insufficient funds");
              }
              return this.balance;
          }
  choices:
  - snippet: |2-

          public int withdraw(int amount) {
              if (0 < amount && amount <= this.balance) {
                  this.balance = this.balance - amount;
                  System.out.println("Withdrew " + amount);
              } else {
                  System.out.println("Insufficient funds");
              }
              return this.balance;
          }
    role: solution
    explanations:
    - body: 'Correct! Verifies that `0 < amount && amount <= this.balance`, debits
        the account when funds are sufficient, prints an error message when funds
        are insufficient, and returns `this.balance`.

'
  - snippet: |-
      public int withdraw(int amount) {
          this.balance = this.balance - amount;
          System.out.println("Withdrew " + amount);
          return this.balance;
      }
    role: distractor
    explanations:
    - body: 'Incorrect. Unconditionally deducts `amount` without verifying if `amount
        <= this.balance`, allowing the account balance to plunge into negative numbers.

'
  - snippet: |-
      public int withdraw(int amount) {
          if (0 < amount && amount > this.balance) {
              this.balance = this.balance - amount;
              System.out.println("Withdrew " + amount);
          } else {
              System.out.println("Insufficient funds");
          }
          return this.balance;
      }
    role: distractor
    explanations:
    - body: 'Incorrect. The comparison `amount > this.balance` inverts the logic:
        it only allows withdrawals when the amount exceeds the balance, guaranteeing
        an overdraft on every successful withdrawal!

'
