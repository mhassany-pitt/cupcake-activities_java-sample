$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: pp_bank_account
source: BankAccount.java
title: Bank Account Methods and Constructor in Java
description: Rearrange the Java methods and constructor to properly manage BankAccount instance state and enforce transaction safety.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - classes
  topics:
    - classes
    - constructors
    - methods
    - conditional-logic
    - variable-scope
runtime:
  language: java
  version: 17
statement: |
  Rearrange the blocks to correctly implement the constructor and methods for the `BankAccount` class in Java.
  Make sure to:
  1. Initialize the instance fields (`owner` and `balance`) using `this`.
  2. Implement the `deposit` method with positive input validation.
  3. Implement the `withdraw` method with strict overdraft protection and insufficient funds notification.
hints:
  - "Arrange the code blocks in logical sequential order from initialization to final output."
  - "Ensure correct block indentation where applicable."
testcases:
  - title: Standard Transaction
    visible: true
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    feedback:
      on_pass:
        - "Correct! All blocks are sequenced properly to produce the expected output."
      on_fail:
        - "The block ordering or indentation is incorrect. Re-examine the flow of execution."
elements:
  - type: block
    group: bank-members
    location:
      snippet: |2-
            public BankAccount(String owner, int balance) {
                this.owner = owner;
                this.balance = balance;
            }
    choices:
      - snippet: |2-
              public BankAccount(String owner, int balance) {
                  this.owner = owner;
                  this.balance = balance;
              }
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Uses `this.owner = owner;` and `this.balance = balance;` to assign constructor parameter values to instance fields.
      - snippet: |-
          public BankAccount(String owner, int balance) {
              owner = owner;
              balance = balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Without `this.`, `owner = owner` assigns parameters back to themselves (shadowing) without updating the actual instance fields `this.owner` and `this.balance`.
  - type: block
    group: bank-members
    location:
      snippet: |2-
            public int deposit(int amount) {
                if (amount > 0) {
                    this.balance = this.balance + amount;
                    System.out.println("Deposited " + amount);
                }
                return this.balance;
            }
    choices:
      - snippet: |2-
              public int deposit(int amount) {
                  if (amount > 0) {
                      this.balance = this.balance + amount;
                      System.out.println("Deposited " + amount);
                  }
                  return this.balance;
              }
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Validates that `amount > 0` before updating `this.balance`, prints confirmation, and returns the updated balance.
  - type: block
    group: bank-members
    location:
      snippet: |2-
            public int withdraw(int amount) {
                if (0 < amount && amount <= this.balance) {
                    this.balance = this.balance - amount;
                    System.out.println("Withdrew " + amount);
                } else {
                    System.out.println("Insufficient funds");
                }
                return this.balance;
            }
    choices:
      - snippet: |2-
              public int withdraw(int amount) {
                  if (0 < amount && amount <= this.balance) {
                      this.balance = this.balance - amount;
                      System.out.println("Withdrew " + amount);
                  } else {
                      System.out.println("Insufficient funds");
                  }
                  return this.balance;
              }
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Verifies that `0 < amount && amount <= this.balance`, debits the account when funds are sufficient, prints an error message when funds are insufficient, and returns `this.balance`.
      - snippet: |-
          public int withdraw(int amount) {
              this.balance = this.balance - amount;
              System.out.println("Withdrew " + amount);
              return this.balance;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Unconditionally deducts `amount` without verifying if `amount <= this.balance`, allowing the account balance to plunge into negative numbers.
