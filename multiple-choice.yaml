question: |
  Given the following Java class definition:
  
  ```java
  public class BankAccount {
      public String owner;
      public int balance;

      public BankAccount(String owner, int balance) {
          this.owner = owner;
          this.balance = balance;
      }
  }
  ```
  
  Which of the following represents the correct implementation for a `deposit` method in Java that validates positive deposit amounts, modifies the instance balance, and returns the new balance?
choices:
  - body: |
      ```java
      public int deposit(int amount) {
          if (amount > 0) {
              this.balance += amount;
              return this.balance;
          }
          throw new IllegalArgumentException("Deposit amount must be positive");
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! This implementation:
          1. Validates that `amount > 0`.
          2. Mutates instance state using `this.balance += amount`.
          3. Returns the updated `int` balance.
          4. Throws an `IllegalArgumentException` for invalid amounts.
  - body: |
      ```java
      public int deposit(int amount) {
          if (amount > 0) {
              int balance = this.balance + amount;
              return balance;
          }
          return this.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Declaring `int balance = ...` creates a local variable that shadows the instance field, leaving `this.balance` completely unmodified.
  - body: |
      ```java
      public int deposit(int amount) {
          if (amount > 0) {
              this.balance =+ amount;
              return this.balance;
          }
          return this.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The operator `=+` is a unary positive assignment (`this.balance = +amount`), which overwrites the balance with `amount` rather than accumulating funds with `+=`.
  - body: |
      ```java
      public int deposit(int amount) {
          if (amount > 0) {
              this.balance += amount;
          }
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The method is declared with an `int` return type (`public int deposit(...)`), but fails to provide a `return` statement, causing a Java compilation error: `missing return statement`.
