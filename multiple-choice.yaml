question: |
  Given the following Java class definition for `BankAccount`:

  ```java
  public class BankAccount {
      private String owner;
      private int balance;

      public BankAccount(String owner, int balance) {
          this.owner = owner;
          this.balance = balance;
      }
  }
  ```

  Which of the following represents the correct Java method definition for `deposit` that adds a positive `amount` to `this.balance` and returns the new balance?
choices:
  - body: |
      ```java
      public int deposit(int amount) {
          if (amount > 0) {
              this.balance += amount;
          }
          return this.balance;
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          This is correct. It verifies that `amount > 0`, updates the instance field `this.balance` using the `+=` operator, and returns the updated `int` balance.
  - body: |
      ```java
      public void deposit(int amount) {
          if (amount > 0) {
              int balance = balance + amount;
          }
          return balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The return type is declared as `void` but attempts to return a value. In addition, `int balance = balance + amount;` declares a local variable shadowing the instance field.
  - body: |
      ```java
      public int deposit(int amount) {
          this.balance = amount;
          return this.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. This overwrites `this.balance` with `amount` rather than adding to the existing balance, and does not check for positive amounts.
