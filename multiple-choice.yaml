question: |
  Given the following Java class definition for `BankAccount`:
  
  ```java
  public class BankAccount {
      public String owner;
      public int balance;

      public BankAccount(String owner, int balance) {
          this.owner = owner;
          this.balance = balance;
      }
  }
  ```
  
  Which of the following represents the correct implementation for a `deposit` method in Java that adds a positive `amount` to the account balance and returns the new balance?
choices:
  - body: |
      ```java
      public int deposit(int amount) {
          if (amount > 0) {
              this.balance += amount;
              return this.balance;
          }
          throw new IllegalArgumentException("Deposit amount must be positive");
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          This is the correct implementation. It verifies that the deposit `amount` is positive (`amount > 0`), updates the instance field `this.balance` using the `+=` operator, and returns the updated balance. It also correctly throws an `IllegalArgumentException` for invalid amounts.
  - body: |
      ```java
      public int deposit(int amount) {
          if (amount > 0) {
              int balance = balance + amount;
              return balance;
          }
          return balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In Java, declaring `int balance = ...` inside the method creates a shadowed local variable instead of updating the instance variable `this.balance`.
  - body: |
      ```java
      public int deposit(int amount) {
          this.balance =+ amount;
          return this.balance;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The operator `=+` in Java assigns positive `amount` (`this.balance = +amount`), which overwrites the balance rather than adding to it. The correct operator is `+=`.
  - body: None
    role: distractor
    include: always
    order: 2
