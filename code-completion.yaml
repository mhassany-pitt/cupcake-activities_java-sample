source: BankAccount.java
license: MIT
locale: en-US
id: cc_bank_account
title: Complete the BankAccount Java Implementation
description: Fill in essential Java keywords, operators, and method calls to declare classes, update state, and validate transactions.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: code-completion
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - variables
  topics:
    - classes
    - arithmetic
    - relational-operators
    - methods
runtime:
  language: java
  version: 17
statement: |
  Complete the `BankAccount` class implementation by selecting the correct keywords, operators, and method identifiers.
  Make sure to:
  1. Declare the object blueprint using the Java `class` keyword.
  2. Correctly increment `this.balance` during a deposit.
  3. Ensure that withdrawal requests do not exceed the available balance.
  4. Invoke the proper transaction method in the `main` driver method.
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    stderr: ""
    status: pass
elements:
  - type: blank
    location:
      context: "public class BankAccount {"
      snippet: "class"
      nth: 1
    choices:
      - snippet: "class"
        role: solution
        explanations:
          - body: |
              Correct! In Java, the `class` keyword declares a blueprint containing fields, constructors, and methods.
      - snippet: "interface"
        role: distractor
        explanations:
          - body: |
              Incorrect. In Java, an `interface` defines abstract method contracts and static constants; it cannot have instance field state or a standard constructor.
      - snippet: "record"
        role: distractor
        explanations:
          - body: |
              Incorrect. Java `record` declarations are immutable data carriers whose fields are implicitly `final` and cannot be mutated by a `deposit` or `withdraw` method.
      - snippet: "struct"
        role: distractor
        explanations:
          - body: |
              Incorrect. `struct` is a keyword in C/C++/Rust/C#, but is not a valid keyword in Java.
  - type: blank
    location:
      context: "this.balance = this.balance + amount;"
      snippet: "+"
      nth: 1
    choices:
      - snippet: "+"
        role: solution
        explanations:
          - body: |
              Correct! The addition operator (`+`) adds the deposited `amount` to the current `this.balance`, crediting the account.
      - snippet: "-"
        role: distractor
        explanations:
          - body: |
              Incorrect. The subtraction operator (`-`) would deduct money from the account during a deposit instead of crediting it.
      - snippet: "*"
        role: distractor
        explanations:
          - body: |
              Incorrect. The multiplication operator (`*`) would multiply the existing balance by the deposit amount, yielding an incorrect balance.
      - snippet: "="
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `=` causes a compilation error or overwrites the balance with `amount` rather than accumulating funds.
  - type: blank
    location:
      context: "if (0 < amount && amount <= this.balance) {"
      snippet: "<="
      nth: 1
    choices:
      - snippet: "<="
        role: solution
        explanations:
          - body: |
              Correct! The less-than-or-equal operator (`<=`) ensures the user has sufficient funds, allowing withdrawals up to and including the exact total balance without overdrafting.
      - snippet: "<"
        role: distractor
        explanations:
          - body: |
              Incorrect. The strictly-less-than operator (`<`) would prevent account holders from withdrawing their exact entire balance (withdrawing down to zero).
      - snippet: ">="
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>=` would invert the business logic, permitting withdrawals only when the amount is greater than or equal to the balance, guaranteeing an overdraft.
      - snippet: ">"
        role: distractor
        explanations:
          - body: |
              Incorrect. Using `>` would only permit transactions that exceed the current balance, causing an immediate overdraft into negative funds.
  - type: blank
    location:
      context: "account.deposit(100);"
      snippet: "deposit"
      nth: 1
    choices:
      - snippet: "deposit"
        role: solution
        explanations:
          - body: |
              Correct! Invokes the `deposit` method with an argument of `100` to credit the account.
      - snippet: "withdraw"
        role: distractor
        explanations:
          - body: |
              Incorrect. Invoking `withdraw(100)` would debit the account instead of performing the required deposit transaction.
      - snippet: "balance"
        role: distractor
        explanations:
          - body: |
              Incorrect. `balance` is an `int` field, not a callable method; attempting `account.balance(100)` causes a Java compilation error (`cannot find symbol method balance(int)`).
