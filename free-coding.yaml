statement: |
  Implement a `transfer` method or sequence in `main` to move money from one `BankAccount` to another.
  The method signature in Java can be:
  ```java
  public void transfer(BankAccount targetAccount, int amount) {
      // Your implementation here
  }
  ```
  Ensure that money is withdrawn from the current account only if funds are sufficient, and deposited into the target account.
