$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: BankAccount.java
license: MIT
locale: en-US
id: free_coding_bank_account
title: Bank Account Management in Java
description: Instantiate a BankAccount object, execute deposit and withdrawal transactions, and inspect the resulting balance.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - classes
  topics:
    - classes
    - constructors
    - methods
    - state
runtime:
  language: java
  version: 17
statement: |
  In the `main` method, write the Java code to interact with the `BankAccount` class:
  1. Instantiate a new `BankAccount` named `account` for owner `"Bob"` with an initial balance of `200`.
  2. Call `deposit` with an amount of `100`.
  3. Call `withdraw` with an amount of `50`.
  4. Print the final balance to the console in the format: `Balance: <balance>`.
elements:
  - type: locked
    location:
      snippet: |-
        public class BankAccount {
            public String owner;
            public int balance;

            public BankAccount(String owner, int balance) {
                this.owner = owner;
                this.balance = balance;
            }

            public int deposit(int amount) {
                if (amount > 0) {
                    this.balance = this.balance + amount;
                    System.out.println("Deposited " + amount);
                }
                return this.balance;
            }

            public int withdraw(int amount) {
                if (0 < amount && amount <= this.balance) {
                    this.balance = this.balance - amount;
                    System.out.println("Withdrew " + amount);
                } else {
                    System.out.println("Insufficient funds");
                }
                return this.balance;
            }
  - type: editable
    location:
      snippet: |2-
                BankAccount account = new BankAccount("Bob", 200);
                account.deposit(100);
                account.withdraw(50);
                System.out.println("Balance: " + account.balance);
    placeholder: |-
      // 1. Create a BankAccount for "Bob" with 200 initial balance
      // 2. Deposit 100
      // 3. Withdraw 50
      // 4. Print "Balance: " + account.balance
testcases:
  - title: Standard Account Workflow
    visible: true
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
    hints:
      - "Review the problem statement and ensure the steps are executed in order."
      - "Verify that initial values, deposits, withdrawals, and prints match the specification."
    feedback:
      - on_pass:
          - explanations:
              - "Great job! Your solution executed properly and matched all expected outputs."
        on_fail:
          - explanations:
              - "Your code produced differing output. Double-check your method calls and printed formatting."
