statement: |
  This worked example demonstrates how the `BankAccount` class manages state in Java. We'll examine:
  1. Class constructor (`public BankAccount(...)`)
  2. Deposit method (`deposit`)
  3. Withdrawal method with validation (`withdraw`)
executions:
