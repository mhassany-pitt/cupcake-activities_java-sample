elements:
  - type: explanation
    location:
      snippet: "public BankAccount(String owner, int balance) {"
    explanations:
      - body: |
          The constructor initializes the account owner and starting balance. In Java, this is written as:
          ```java
          public BankAccount(String owner, int balance) {
              this.owner = owner;
              this.balance = balance;
          }
          ```
          The fields `owner` and `balance` are assigned directly to the newly created instance.
      - body: |
          ...
  - type: explanation
    location:
      snippet: "if (0 < amount && amount <= this.balance) {"
    explanations:
      - body: |
          This condition validates that the withdrawal transaction is correct: it checks if the `amount` is greater than `0` and is less than or equal to the current `this.balance`.
