      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: explanation
    location:
      snippet: "public BankAccount(String owner, int balance) {"
    explanations:
      - body: |
          The constructor initializes the account owner and starting balance in Java:
          ```java
          public BankAccount(String owner, int balance) {
              this.owner = owner;
              this.balance = balance;
          }
          ```
  - type: explanation
    location:
      snippet: "if (amount > 0 && amount <= this.balance) {"
    explanations:
      - body: |
          This condition validates that the withdrawal transaction is correct: it checks that `amount > 0` and is less than or equal to `this.balance`.
